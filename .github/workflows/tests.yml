name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Run tests
        shell: bash
        run: |
          # Mirror the output into the job summary, which is readable without
          # signing in to GitHub. Raw step logs are not.
          status=0
          pytest -q --tb=short 2>&1 | tee /tmp/pytest.log || status=${PIPESTATUS[0]}
          {
            echo '### pytest'
            echo '```'
            tail -c 8000 /tmp/pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
